config_version = "0"

exclude_patterns = [
  "src/test/resources/fixtures/**",
]

# Package-private `_*` cores/helpers and load-bearing build scripts are
# domain-bounded plumbing: skip structural grading, but keep other scans.
[[ignore]]
plugins = ["qlty"]
file_patterns = ["**/_*.ts", "scripts/**", "src/test/**"]

# Thresholds tuned to this codebase's idioms (fail-closed returns, format-dispatch
# branching); file_complexity, duplication, boolean_logic, nesting keep defaults.
[smells.return_statements]
threshold = 10

[smells.function_parameters]
threshold = 8

[smells.function_complexity]
threshold = 30

[[source]]
name = "default"
default = true

[[plugin]]
name = "osv-scanner"

# Vendored lockfiles are immutable test inputs from third-party projects, not
# lockgraph's dependency graph. Keep osv-scanner enabled for the root lockfile,
# but exclude those fixtures from the supply-chain report.
[[exclude]]
plugins = ["osv-scanner"]
file_patterns = [
  "src/test/resources/fixtures/**",
]
