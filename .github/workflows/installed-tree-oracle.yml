name: Installed-tree oracle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  six-family-pr-sample:
    name: Six-family PR sample
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - name: Retain the Node 18 runtime selector
        run: echo "LOCKGRAPH_NODE18=$(command -v node)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Retain the Node 22 runtime selector
        run: echo "LOCKGRAPH_NODE22=$(command -v node)" >> "$GITHUB_ENV"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.8
      - name: Retain the Deno 2.2.8 runtime selector
        run: |
          mkdir -p tmp/deno-oracle/2.2.8
          cp "$(command -v deno)" tmp/deno-oracle/2.2.8/deno

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Retain the Deno 2.9.6 runtime selector
        run: |
          mkdir -p tmp/deno-oracle/2.9.6
          cp "$(command -v deno)" tmp/deno-oracle/2.9.6/deno

      - run: npm ci
      - run: npm run build:dist
      - run: npm run test:installed-tree

      - name: Upload the typed receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-tree-oracle-receipt
          path: target/installed-tree-oracle/receipt.json
          if-no-files-found: error
